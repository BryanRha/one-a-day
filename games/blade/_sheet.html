<!doctype html><head><meta charset="utf-8"><script type="importmap">{"imports":{"three":"./lib/three.module.min.js"}}</script></head><body style="margin:0;background:#334"><script type="module">
// 애니메이션 확인용 낱장: ?id=warrior&clip=a1&n=8&yaw=0.6&from=0&to=
import * as THREE from 'three'; import { load, spawn } from './src/assets.js';
const q = new URLSearchParams(location.search), id = q.get('id'), clipL = (q.get('clip') || 'idle').split(','), n = +(q.get('n') || 8), yaw = +(q.get('yaw') ?? 0.6), cols = clipL.length > 1 ? n : Math.min(n, 4), rows = clipL.length > 1 ? clipL.length : Math.ceil(n / cols), CW = +(q.get('cw') || 300), CH = Math.round(CW * 1.13);
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(CW * cols, CH * rows); r.outputColorSpace = THREE.SRGBColorSpace; r.setScissorTest(true); document.body.append(r.domElement);

const grid = new THREE.GridHelper(600, 12, 0x8899aa, 0x556677); sc.add(grid); const ax = new THREE.ArrowHelper(new THREE.Vector3(0, 0, 1), new THREE.Vector3(0, 2, 0), 120, 0xff4444); sc.add(ax);

for (const [x, y, t] of lbl) { const d = document.createElement('div'); d.textContent = t + 's'; d.style.cssText = `position:absolute;left:${x + 6}px;top:${y + 4}px;color:#fff;font:14px sans-serif`; document.body.append(d); }
