<!doctype html><head><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script></head><body><script type="module">
// TGA → WebP (최대 크기 축소) · 알파: 원본 알파 / 별도 마스크 / 모서리 색 빼기(key)
import { TGALoader } from 'three/addons/loaders/TGALoader.js';
const tl = new TGALoader(); const get = u => new Promise((ok, no) => tl.load(u, t => ok(t.image), undefined, no));
window.conv = async (src, mask, key, max, alpha) => {
  const im = await get(src); const s = Math.min(1, max / Math.max(im.width, im.height)), w = Math.round(im.width * s), h = Math.round(im.height * s);
  const full = document.createElement('canvas'); full.width = im.width; full.height = im.height; const fx = full.getContext('2d'); const id = new ImageData(new Uint8ClampedArray(im.data), im.width, im.height);
  const d = id.data; let hasA = false; for (let i = 3; i < d.length; i += 4) if (d[i] < 250) { hasA = true; break; }
  if (alpha && mask) { const m = await get(mask); const md = m.data, sx = m.width / im.width, sy = m.height / im.height; for (let y = 0; y < im.height; y++) for (let x = 0; x < im.width; x++) { const j = (Math.floor(y * sy) * m.width + Math.floor(x * sx)) * 4; d[(y * im.width + x) * 4 + 3] = md[j]; } }
  else if (alpha && !hasA && key) { const r0 = d[0], g0 = d[1], b0 = d[2]; for (let i = 0; i < d.length; i += 4) { const e = Math.abs(d[i] - r0) + Math.abs(d[i + 1] - g0) + Math.abs(d[i + 2] - b0); d[i + 3] = e < 40 ? 0 : e < 70 ? (e - 40) * 8.5 : 255; } }
  else if (!alpha) for (let i = 3; i < d.length; i += 4) d[i] = 255;
  fx.putImageData(id, 0, 0); const c = document.createElement('canvas'); c.width = w; c.height = h; const cx = c.getContext('2d'); cx.imageSmoothingQuality = 'high'; cx.drawImage(full, 0, 0, w, h);
  return { url: c.toDataURL('image/webp', 0.86), hasA, w, h };
};
window.ready = 1;
</script></body>
