<!doctype html><head><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script></head><body><script type="module">
// 소품(정지 모델) 변환: FBX → GLB · 재질 이름 = 원본 텍스처 파일 이름 (게임에서 tex/ 에서 찾아 붙임)
import * as THREE from 'three'; import { FBXLoader } from './FBXLoader.js'; import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
const mgr = new THREE.LoadingManager(); const fake = { setPath() { return this; }, setCrossOrigin() { return this; }, load(f) { const t = new THREE.Texture(); t.userData.file = String(f).split(/[\\/]/).pop(); return t; } };
mgr.addHandler(/\.(tga|psd|dds|bmp)$/i, fake); mgr.setURLModifier(u => /\.(png|jpe?g)$/i.test(u) ? 'data:,' : u);
const L = new FBXLoader(mgr);
window.convert = async (f, rotX) => {
  const o = await new Promise((ok, no) => L.load('./src/props/' + encodeURIComponent(f), ok, undefined, no)); o.animations = [];
  const wrap = new THREE.Group(); wrap.add(o); if (rotX) o.rotation.x = rotX; wrap.updateMatrixWorld(true); const mats = new Set();
  o.traverse(m => { if (!m.isMesh) return; const ms = Array.isArray(m.material) ? m.material : [m.material];
    const nm = ms.map(x => { const file = x.map?.userData?.file || (x.map?.name) || ''; mats.add(file); return new THREE.MeshStandardMaterial({ name: file || 'none', color: x.color }); });
    m.material = Array.isArray(m.material) ? nm : nm[0]; if (m.isSkinnedMesh) { m.isSkinnedMesh = false; } });
  const bb = new THREE.Box3().setFromObject(wrap), size = bb.getSize(new THREE.Vector3());
  const glb = await new GLTFExporter().parseAsync(wrap, { binary: true, onlyVisible: false });
  const u8 = new Uint8Array(glb); let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return { b64: btoa(s), mats: [...mats], size: size.toArray().map(Math.round), min: bb.min.toArray().map(Math.round) };
};
window.ready = 1;
</script></body>
