<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1F8FE6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ocean Tales">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ocean Tales</title>
<meta name="description" content="귀여운 바다 친구들을 맞추는 매치3 퍼즐 게임">
<meta property="og:title" content="Ocean Tales">
<meta property="og:description" content="귀여운 바다 친구들을 맞추는 매치3 퍼즐 게임">
<meta property="og:image" content="icons/og_image.png">
<link rel="icon" href="icons/favicon_32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple_touch_icon.png">
<style>
  @font-face { font-family: 'Jua'; src: url('fonts/Jua-Regular.ttf') format('truetype'); font-display: block; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: linear-gradient(#5FD8FF, #1E8FE6); touch-action: none; -webkit-user-select: none; user-select: none; }
  #game { position: fixed; top: env(safe-area-inset-top, 0px); bottom: env(safe-area-inset-bottom, 0px); left: 0; right: 0; }
  #boot { position: fixed; inset: 0; display: grid; place-items: center; font: 28px Jua, sans-serif; color: #FFFFFF; }
  canvas { display: block; }
  /* 휴대폰을 가로로 돌리면 안내만 보여 준다 (게임은 세로 전용) */
  #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: linear-gradient(#5FD8FF, #1E8FE6); color: #fff;
            font: 30px Jua, sans-serif; text-align: center; place-items: center; text-shadow: 0 3px 0 #123A6E; }
  #rotate b { display: block; font-size: 72px; margin-bottom: 12px; animation: tilt 1.6s ease-in-out infinite; }
  @keyframes tilt { 0%, 100% { transform: rotate(90deg); } 50% { transform: rotate(0deg); } }
  @media (orientation: landscape) and (pointer: coarse) and (max-height: 560px) { #rotate { display: grid; } }
</style>
</head>
<body>
<div id="boot">Ocean Tales</div>
<div id="game"></div>
<div id="rotate"><div><b>📱</b>화면을 세로로 돌려 주세요<br><small>Please rotate to portrait</small></div></div>
<script src="lib/phaser.min.js"></script>
<script type="module" src="src/main.js?v=0.41.0"></script>
</body>
</html>
