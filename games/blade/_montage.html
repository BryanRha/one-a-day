<!doctype html><body style="margin:0;background:#111;display:flex;flex-wrap:wrap;width:100vw"><script>
// 이미지 여러 장 붙여 보기: ?w=600&lab=1&i=a.png,b.png (파일은 ~/action3d-dist/_m/)
const q = new URLSearchParams(location.search); let n = 0; const L = q.get('i').split(',');
for (const f of L) { const d = document.createElement('div'); d.style.cssText = 'position:relative'; const im = new Image(); im.src = '_m/' + f; im.style.cssText = 'display:block;width:' + (q.get('w') || 600) + 'px';
  im.onload = im.onerror = () => { if (++n === L.length) window.done = 1; }; d.append(im);
  if (q.get('lab')) { const t = document.createElement('span'); t.textContent = f; t.style.cssText = 'position:absolute;left:4px;top:2px;color:#fff;font:12px sans-serif;text-shadow:0 1px 2px #000'; d.append(t); } document.body.append(d); }
</script></body>
